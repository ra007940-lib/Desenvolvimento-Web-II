<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Criação de Chinchilas</title>
    <link rel="stylesheet" href="css/bootstrap.min.css">
</head>
<body>
    <div class="container">
        <div class="row">
            <div class="col-4">
                <img src="imagens/exerc.jpg" alt="Chinchilas" class="img-fluid">
            </div>
            <div class="col-8">
                <h1>Programa Criação de Chinchilas</h1>
                <form action="">
                    <p>Nº Chinchilas:
                        <input type="number" id="inChinchilas" min="2" required>
                    </p>
                    <p>Nº Anos:
                        <input type="number" id="inAnos" min="1" required>
                    </p>
                    <input type="submit" value="Mostrar Previsão de Chinchilas" class="btn btn-success">
                </form>
                <p>&nbsp;</p>
                <pre id="outResp"></pre>
            </div>
        </div>
    </div>
    <script src="js/ex02.js"></script>
</body>
</html>
