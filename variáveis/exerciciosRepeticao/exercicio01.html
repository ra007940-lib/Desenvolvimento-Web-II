<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Repete Fruta</title>
    <link rel="stylesheet" href="css/bootstrap.min.css">
</head>
<body>
    <div class="container">
        <div class="row">
            <div class="col-4">
                <img src="imagens/exerc.jpg" alt="Frutas" class="img-fluid">
            </div>
            <div class="col-8">
                <h1>Programa Repete Fruta</h1>
                <form action="">
                    <p>Fruta:
                        <input type="text" id="inFruta" required>
                    </p>
                    <p>Número:
                        <input type="number" id="inNumero" min="1" required>
                    </p>
                    <input type="submit" value="Repetir Fruta" class="btn btn-success">
                </form>
                <p>&nbsp;</p>
                <pre id="outResp"></pre>
            </div>
        </div>
    </div>
    <script src="js/ex01.js"></script>
</body>
</html>
