<meta charset="UTF-8">
<script>
    const ValordaConta = Number(prompt("Valor total da compra: "))
    const Clientes = Number(prompt("Número de clientes: "))
    const ValorporCliente = ValordaConta / Clientes
    alert(`Valor da conta: R$ ${ValordaConta.toFixed(2)}\nClientes: ${Clientes}\nValor por cliente: R$ ${ValorporCliente.toFixed(2)}`)
</script>
