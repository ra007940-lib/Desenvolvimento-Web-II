<meta charset="UTF-8">
<script>
    const PrecoProduto = Number(prompt("Valor do produto: "))
    const ValorVista = PrecoProduto * 0.9
    const Parcelado = PrecoProduto / 3
    alert(`Preço do Produto: R$ ${PrecoProduto.toFixed(2)}\nÁ vista: R$ ${ValorVista.toFixed(2)}\nParcelado: 3x de R$ ${Parcelado.toFixed(2)}`)
</script>
