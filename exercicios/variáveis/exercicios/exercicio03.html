<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Super Mercado JS</title>
    <link rel="stylesheet" href="css/bootstrap.min.css">
</head>
<body>
    <div class="container">
        <div class="rol">
            <div class="col">
                <h1>Super Mercado JS</h1>
                <form action="">
                    <p>Produto:
                        <input type="text" id="inProduto" required>
                    </p>
                    <p>Preço:
                        <input type="number" id="inPreco" step="0.01" required>
                    </p>
                    <input type="submit" value="Ver promoção" class="btn btn-success">
                </form>
            </div>
        </div>
    </div>
    <h3></h3>
    <script src="js/exercicio03.js"></script>
</body>
</html>
